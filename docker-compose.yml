###############################################################################
#  STEALTHNET 3.2.7 — Docker Compose
#  Репозиторий: https://github.com/STEALTHNET-APP/remnawave-STEALTHNET-Bot
#  Запуск: docker compose up -d
###############################################################################
name: stealthnet

services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stealthnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stealthnet}
      POSTGRES_USER: ${POSTGRES_USER:-stealthnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stealthnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stealthnet} -d ${POSTGRES_DB:-stealthnet}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────────
  # Работает на порту 5000, прокидывается через reverse proxy
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stealthnet-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-stealthnet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stealthnet}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_ACCESS_EXPIRES_IN: "${JWT_ACCESS_EXPIRES_IN:-15m}"
      JWT_REFRESH_EXPIRES_IN: "${JWT_REFRESH_EXPIRES_IN:-7d}"
      CORS_ORIGIN: "https://${DOMAIN:-localhost}"
      REMNA_API_URL: "${REMNA_API_URL:-}"
      REMNA_ADMIN_TOKEN: "${REMNA_ADMIN_TOKEN:-}"
      REMNA_SECRET_KEY: "${REMNA_SECRET_KEY:-}"
      INIT_ADMIN_EMAIL: "${INIT_ADMIN_EMAIL:-admin@stealthnet.local}"
      INIT_ADMIN_PASSWORD: "${INIT_ADMIN_PASSWORD:-}"
      BOT_TOKEN: "${BOT_TOKEN:-}"
      TELEGRAM_API_PROVIDER: "${TELEGRAM_API_PROVIDER:-official}"
    volumes:
      - /etc/ssh:/host-etc/ssh
      - /proc:/host-proc:ro
      - uploads_data:/app/uploads
    pid: host
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stealthnet

  # ── Frontend Build ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stealthnet-frontend
    volumes:
      - frontend_dist:/app/dist
    networks:
      - stealthnet

  # ── Nginx ────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: stealthnet-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/var/www/stealthnet:ro
    depends_on:
      - api
      - frontend
    networks:
      - stealthnet

  # ── Telegram Bot ────────────────────────────────────────────────
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: stealthnet-bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: "${BOT_TOKEN:-}"
      API_URL: "http://api:5000"
    depends_on:
      - api
    networks:
      - stealthnet

volumes:
  postgres_data:
  uploads_data:
  frontend_dist:

networks:
  stealthnet:
    driver: bridge
